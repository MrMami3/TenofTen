<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Sayı Bulmacası</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <div id="menu-screen" class="container">
            <h1>100'e Ulaş!</h1>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="İsmini Yaz Bro..." maxlength="15">
            </div>

            <div class="button-group">
                <button id="play-btn" class="btn green-btn">PLAY</button>
                <button id="show-scores-btn" class="btn blue-btn">SCOREBOARD</button>
            </div>
        </div>

        <div id="game-screen" class="container hidden">
            <div class="game-header">
                <span id="player-label"></span>
                <span class="score-label">Sayı: <b id="next-number">1</b></span>
            </div>
            <div id="game-board" class="grid"></div>
            <button id="quit-btn" class="btn red-btn">Menüye Dön</button>
        </div>

        <div id="score-screen" class="container hidden">
            <h2>Liderler Tablosu</h2>
            <div class="score-list" id="score-list">
                </div>
            <button id="back-btn" class="btn red-btn">Geri Dön</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
