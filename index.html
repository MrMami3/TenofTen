<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenOfTen</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #3498db;
            --bg: #0a0a0a;
            --card: #151515;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #222;
            text-align: center;
            width: 420px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Ekranları gizlemek için daha garanti yöntem */
        .page { display: none; }
        .active { display: block !important; }

        .main-title {
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary);
            font-size: 3rem;
            margin-bottom: 30px;
            letter-spacing: 5px;
        }

        input {
            width: 80%;
            padding: 15px;
            background: #000;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
            font-family: 'Orbitron';
            font-size: 1.1rem;
            outline: none;
        }

        .btn-row {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Orbitron';
            transition: 0.3s;
            flex: 1;
        }

        .green { background: var(--primary); color: #000; }
        .blue { background: var(--secondary); color: #fff; }
        .red { background: #e74c3c; color: #fff; margin-top: 20px; width: 100%; }
        .yellow { background: #f1c40f; color: #000; flex: 1; }

        .btn:hover { transform: translateY(-3px); filter: brightness(1.2); }

        /* Oyun Tahtası */
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 35px);
            gap: 5px;
            background: #000;
            padding: 10px;
            border-radius: 10px;
            margin: 20px auto;
            width: fit-content;
        }

        .cell {
            width: 35px;
            height: 35px;
            background: #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
        }

        .cell.hint { background: rgba(52, 152, 219, 0.3); border: 1px solid var(--secondary); }
        .cell.filled { background: var(--primary); color: #000; font-weight: bold; box-shadow: 0 0 10px var(--primary); }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.8rem;
            color: #888;
        }

        .score-box {
            background: #000;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- MENÜ -->
    <div id="menu-page" class="container page active">
        <h1 class="main-title">TenOfTen</h1>
        
        <input type="text" id="user-input" placeholder="İSMİNİ YAZ BRO..." maxlength="15">

        <div class="btn-row">
            <button onclick="startPlay()" class="btn green">PLAY</button>
            <button onclick="viewScores()" class="btn blue">SCORES</button>
        </div>
    </div>

    <!-- OYUN -->
    <div id="game-page" class="container page">
        <div class="stats">
            <div id="p-name"></div>
            <div>SAYI: <span id="cur-num" style="color:var(--primary)">1</span></div>
        </div>
        
        <div id="board" class="grid"></div>

        <div class="btn-row">
            <button onclick="initGame()" class="btn yellow">SIFIRLA</button>
            <button onclick="goMenu()" class="btn blue" style="flex:1">GERİ</button>
        </div>
    </div>

    <!-- SIRALAMA -->
    <div id="score-page" class="container page">
        <h2 style="color:var(--secondary)">TOP 10</h2>
        <div id="score-list" class="score-box"></div>
        <button onclick="goMenu()" class="btn red">ANA MENÜ</button>
    </div>

    <script>
        let num = 1;
        let last = null;
        let activeUser = "";

        // Sayfa açıldığında ismi kilitleme
        window.onload = () => {
            const saved = localStorage.getItem('ten_user');
            if(saved) {
                const input = document.getElementById('user-input');
                input.value = saved;
                input.readOnly = true;
                input.style.opacity = "0.5";
                input.style.cursor = "not-allowed";
            }
        };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startPlay() {
            const input = document.getElementById('user-input');
            const name = input.value.trim();
            
            if(!name) {
                alert("İsim yazmadan giremezsin bro!");
                return;
            }

            if(!localStorage.getItem('ten_user')) {
                localStorage.setItem('ten_user', name);
            }

            activeUser = name;
            document.getElementById('p-name').innerText = "PİLOT: " + name;
            showPage('game-page');
            initGame();
        }

        function viewScores() {
            const data = JSON.parse(localStorage.getItem('ten_data') || "[]");
            const list = document.getElementById('score-list');
            list.innerHTML = data.map((s, i) => `
                <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #222;">
                    <span>${i+1}. ${s.name}</span>
                    <span style="color:var(--primary)">${s.score} Puan</span>
                </div>
            `).join('') || "Henüz rekor yok!";
            showPage('score-page');
        }

        function goMenu() {
            showPage('menu-page');
        }

        function initGame() {
            num = 1;
            last = null;
            document.getElementById('cur-num').innerText = "1";
            const b = document.getElementById('board');
            b.innerHTML = '';

            for (let i = 0; i < 100; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => move(i, cell);
                b.appendChild(cell);
            }
            refresh();
        }

        function move(i, cell) {
            const r = Math.floor(i / 10), c = i % 10;
            if(cell.classList.contains('filled')) return;

            if(num === 1 || check(r, c)) {
                cell.innerText = num;
                cell.classList.add('filled');
                last = { r, c };

                updateScore(activeUser, num);

                if(num === 100) alert("EFSANESİN!");

                num++;
                document.getElementById('cur-num').innerText = num;
                refresh();
            }
        }

        function check(r, c) {
            if(!last) return true;
            const dr = Math.abs(r - last.r);
            const dc = Math.abs(c - last.c);
            return (dr === 3 && dc === 0) || (dr === 0 && dc === 3) || (dr === 2 && dc === 2);
        }

        function refresh() {
            document.querySelectorAll('.cell').forEach((cell, i) => {
                cell.classList.remove('hint');
                const r = Math.floor(i / 10), c = i % 10;
                if(!cell.classList.contains('filled') && check(r, c)) {
                    cell.classList.add('hint');
                }
            });
        }

        function updateScore(n, s) {
            let scores = JSON.parse(localStorage.getItem('ten_data') || "[]");
            let idx = scores.findIndex(x => x.name === n);
            if(idx > -1) {
                if(s > scores[idx].score) scores[idx].score = s;
            } else {
                scores.push({ name: n, score: s });
            }
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem('ten_data', JSON.stringify(scores.slice(0, 10)));
        }
    </script>
</body>
</html>
