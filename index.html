<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenOfTen - 100 Reach</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-wrapper">
        <!-- ANA MENÜ -->
        <div id="menu-screen" class="container">
            <h1 class="neon-text">100 REACH</h1>
            
            <div class="input-group">
                <label class="brand-label">TenOfTen</label>
                <input type="text" id="username" placeholder="İsmini Yaz..." maxlength="15">
            </div>

            <div class="button-group">
                <button onclick="playGame()" class="btn green-btn">OYNA</button>
                <button onclick="openLeaderboard()" class="btn blue-btn">SIRALAMA</button>
            </div>
        </div>

        <!-- OYUN EKRANI -->
        <div id="game-screen" class="container hidden">
            <div class="game-header">
                <div id="player-label">PİLOT: ---</div>
                <div class="score-display">HEDEF: <span id="next-number">1</span></div>
            </div>
            
            <div id="game-board" class="grid"></div>

            <div class="game-controls">
                <button onclick="resetGame()" class="btn yellow-btn">SIFIRLA</button>
                <button onclick="goToMenu()" class="btn red-btn">ANA MENÜ</button>
            </div>
        </div>

        <!-- SIRALAMA EKRANI -->
        <div id="score-screen" class="container hidden">
            <h2 class="neon-text-blue">LİDERLER</h2>
            <div class="score-list" id="score-list"></div>
            <button onclick="goToMenu()" class="btn red-btn">GERİ DÖN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
