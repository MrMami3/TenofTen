<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenOfTen & Mirko Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #3498db;
            --bg: #0a0a0a;
            --card: #151515;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #222;
            text-align: center;
            width: 450px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .page { display: none; }
        .active { display: block !important; }

        .main-title {
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary);
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Orbitron';
            transition: 0.3s;
            display: block;
            width: 100%;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .green { background: var(--primary); color: #000; }
        .blue { background: var(--secondary); color: #fff; }
        .red { background: #e74c3c; color: #fff; }

        /* MIRKO OYUNU STİLLERİ */
        #mirko-stage {
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        #mirko-img {
            width: 150px;
            transition: transform 0.1s;
            user-select: none;
            -webkit-user-drag: none;
        }

        .weapon-rack {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .weapon {
            width: 60px;
            height: 60px;
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .weapon.selected { border-color: var(--primary); background: #333; }

        /* Vuruş Efekti */
        .hit-effect {
            position: absolute;
            color: red;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: flyUp 0.5s ease-out forwards;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) opacity(1); }
            100% { transform: translateY(-50px) opacity(0); }
        }

        /* ÖZEL MOUSE İMLECİ */
        .custom-cursor {
            cursor: none !important;
        }
        
        #sopa-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 40px;
            display: none;
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        /* TEN OF TEN TABLOSU AYARLARI */
        .grid { display: grid; grid-template-columns: repeat(10, 35px); gap: 5px; margin: 20px auto; width: fit-content; }
        .cell { width: 35px; height: 35px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; border-radius: 4px; }
        .cell.filled { background: var(--primary); color: #000; font-weight: bold; }
        .cell.hint { background: rgba(52, 152, 219, 0.2); border: 1px solid var(--secondary); }
    </style>
</head>
<body>

    <div id="sopa-cursor">🏏</div>

    <!-- PORTAL (GİRİŞ EKRANI) -->
    <div id="portal-page" class="container page active">
        <h1 class="main-title">OYUN PORTALI</h1>
        <button onclick="showPage('ten-menu')" class="btn green">TenOfTen OYNA</button>
        <button onclick="showPage('mirko-game')" class="btn blue">MIRKO'YU BENZET</button>
    </div>

    <!-- TEN OF TEN MENÜ -->
    <div id="ten-menu" class="container page">
        <h1 style="color:var(--primary)">TenOfTen</h1>
        <input type="text" id="user-input" placeholder="İSMİNİ YAZ..." style="width:80%; padding:10px; margin-bottom:20px; background:#000; border:1px solid var(--primary); color:white; font-family:'Orbitron';">
        <button onclick="startTen()" class="btn green">BAŞLA</button>
        <button onclick="showPage('portal-page')" class="btn red">GERİ DÖN</button>
    </div>

    <!-- TEN OF TEN OYUN -->
    <div id="ten-game" class="container page">
        <div id="board" class="grid"></div>
        <button onclick="showPage('portal-page')" class="btn red">ÇIKIŞ</button>
    </div>

    <!-- MIRKO OYUNU -->
    <div id="mirko-game" class="container page">
        <h2 style="color:var(--secondary)">MIRKO'YU BENZET</h2>
        <div id="mirko-stage" onclick="hitMirko(event)">
            <!-- Mirko'nun fotoğrafı buraya gelecek -->
            <img id="mirko-img" src="mirko.jpg" alt="MIRKO" onerror="this.src='https://via.placeholder.com/150?text=MIRKO'">
        </div>
        <div class="weapon-rack">
            <div class="weapon" onclick="selectWeapon('🏏', this)">🏏</div>
            <div class="weapon" onclick="selectWeapon('🪓', this)">🪓</div>
            <div class="weapon" onclick="selectWeapon('🥊', this)">🥊</div>
        </div>
        <p id="hit-count" style="margin-top:15px">HASAR: 0</p>
        <button onclick="exitMirko()" class="btn red">LOBİYE DÖN</button>
    </div>

    <script>
        let currentWeapon = "";
        let damage = 0;

        // Sayfa Değiştirme
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id !== 'mirko-game') exitMirko(); // Mirko'dan çıkınca imleci düzelt
        }

        // --- MIRKO OYUNU MANTIĞI ---
        function selectWeapon(w, el) {
            currentWeapon = w;
            document.querySelectorAll('.weapon').forEach(v => v.classList.remove('selected'));
            el.classList.add('selected');
            
            // Mouse imlecini değiştirme
            document.body.classList.add('custom-cursor');
            const c = document.getElementById('sopa-cursor');
            c.innerText = w;
            c.style.display = "block";
        }

        // İmleci Takip Et
        document.addEventListener('mousemove', (e) => {
            const c = document.getElementById('sopa-cursor');
            c.style.left = e.clientX + 'px';
            c.style.top = e.clientY + 'px';
        });

        function hitMirko(e) {
            if(!currentWeapon) {
                alert("Önce bir silah seç bro!");
                return;
            }
            
            damage++;
            document.getElementById('hit-count').innerText = "HASAR: " + damage;

            // Animasyon
            const img = document.getElementById('mirko-img');
            img.style.transform = "scale(0.9) rotate(10deg)";
            setTimeout(() => { img.style.transform = "scale(1) rotate(0deg)"; }, 100);

            // Vuruş Efekti
            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            effect.innerText = "-10";
            effect.style.left = e.offsetX + 'px';
            effect.style.top = e.offsetY + 'px';
            document.getElementById('mirko-stage').appendChild(effect);
            setTimeout(() => effect.remove(), 500);
        }

        function exitMirko() {
            currentWeapon = "";
            document.body.classList.remove('custom-cursor');
            document.getElementById('sopa-cursor').style.display = "none";
            showPage('portal-page');
        }

        // --- TEN OF TEN BAŞLATICI (SADELEŞTİRİLMİŞ) ---
        function startTen() {
            const n = document.getElementById('user-input').value;
            if(!n) return alert("İsim yaz bro!");
            showPage('ten-game');
            initTenBoard();
        }

        function initTenBoard() {
            const b = document.getElementById('board');
            b.innerHTML = '';
            for(let i=0; i<100; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => { cell.classList.add('filled'); cell.innerText = "X"; };
                b.appendChild(cell);
            }
        }
    </script>
</body>
</html>
