<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenOfTen & Mirko</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2ecc71; --secondary: #3498db; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Orbitron', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .container { background: #151515; padding: 30px; border-radius: 20px; border: 2px solid #222; text-align: center; width: 420px; box-shadow: 0 0 30px rgba(0,0,0,0.8); position: relative; }
        .page { display: none; }
        .active { display: block !important; }
        .btn { padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: 'Orbitron'; transition: 0.3s; display: block; width: 100%; margin-bottom: 10px; font-size: 1rem; }
        .green { background: var(--primary); color: #000; }
        .blue { background: var(--secondary); color: #fff; }
        .red { background: #e74c3c; color: #fff; }
        
        /* TEN OF TEN TABLOSU */
        .grid { display: grid; grid-template-columns: repeat(10, 35px); gap: 5px; margin: 20px auto; width: fit-content; }
        .cell { width: 35px; height: 35px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; border-radius: 4px; }
        .cell.filled { background: var(--primary); color: #000; font-weight: bold; box-shadow: 0 0 10px var(--primary); }
        .cell.hint { background: rgba(52, 152, 219, 0.2); border: 1px solid var(--secondary); }

        /* MİRKO OYUNU */
        #mirko-img { width: 220px; height: 220px; object-fit: cover; border-radius: 20px; transition: 0.1s; user-select: none; -webkit-user-drag: none; }
        .weapon-box { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .w-btn { width: 65px; height: 65px; background: #222; border: 2px solid #444; border-radius: 12px; cursor: pointer; font-size: 30px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .w-btn.selected { border-color: var(--primary); background: #222; box-shadow: 0 0 15px var(--primary); }
        
        /* CUSTOM CURSOR */
        .cursor-active { cursor: none !important; }
        #sopa-cursor { position: fixed; pointer-events: none; z-index: 9999; font-size: 50px; display: none; transform: translate(-50%, -50%) rotate(-45deg); }
        input { width: 85%; padding: 12px; background: #000; border: 2px solid var(--primary); color: white; border-radius: 10px; text-align: center; margin-bottom: 20px; font-family: 'Orbitron'; outline: none; }
        input:read-only { opacity: 0.5; cursor: not-allowed; border-color: #444; }
    </style>
</head>
<body id="main-body">

    <div id="sopa-cursor">🏏</div>

    <!-- 1. PORTAL LOBİ -->
    <div id="lobby-page" class="container page active">
        <h1 style="color:var(--primary); text-shadow: 0 0 15px var(--primary); font-size: 3rem; margin-bottom: 40px;">TEN OF TEN</h1>
        <button onclick="changePage('ten-menu')" class="btn green">TenOfTen OYNA</button>
        <button onclick="changePage('mirko-page')" class="btn blue">MİRKO'YU DÖV</button>
    </div>

    <!-- 2. TEN OF TEN GİRİŞ -->
    <div id="ten-menu" class="container page">
        <h2 style="color:var(--primary)">TenOfTen Giriş</h2>
        <input type="text" id="user-input" placeholder="İSMİNİ YAZ..." maxlength="15">
        <button onclick="startTen()" class="btn green">BAŞLA</button>
        <button onclick="changePage('lobby-page')" class="btn red">LOBİYE DÖN</button>
    </div>

    <!-- 3. TEN OF TEN OYUN TAHTASI -->
    <div id="ten-game" class="container page">
        <div style="display:flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 10px;">
            <div id="active-p"></div>
            <div>HEDEF: <span id="cur-num" style="color:var(--primary)">1</span></div>
        </div>
        <div id="board" class="grid"></div>
        <button onclick="initTen()" class="btn blue">SIFIRLA</button>
        <button onclick="changePage('lobby-page')" class="btn red">ÇIKIŞ</button>
    </div>

    <!-- 4. MİRKO DÖVMECE -->
    <div id="mirko-page" class="container page">
        <h2 style="color:var(--secondary)">MİRKO'YU DÖV</h2>
        <div style="padding: 10px; position: relative;" id="hit-zone">
            <img id="mirko-img" src="mirko.jpg" onclick="hit(event)" onerror="this.src='https://via.placeholder.com/220?text=MIRKO'">
        </div>
        <div class="weapon-box">
            <div class="w-btn" id="w1" onclick="pick('🏏', 'w1')">🏏</div>
            <div class="w-btn" id="w2" onclick="pick('🪓', 'w2')">🪓</div>
            <div class="w-btn" id="w3" onclick="pick('🥊', 'w3')">🥊</div>
        </div>
        <p id="mirko-stats" style="margin-top: 20px; font-weight: bold;">HASAR: 0</p>
        <button onclick="exitMirko()" class="btn red">LOBİYE DÖN</button>
    </div>

    <audio id="hit-sound" src="tok.mp3"></audio>

    <script>
        let num = 1, last = null, activeUser = "", darbe = 0, selectedW = "";
        const snd = document.getElementById('hit-sound'), csr = document.getElementById('sopa-cursor');

        // Sayfa Yönetimi
        function changePage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'ten-menu') checkUser();
        }

        // --- TEN OF TEN MANTIĞI ---
        function checkUser() {
            const saved = localStorage.getItem('ten_user');
            if(saved) {
                const inp = document.getElementById('user-input');
                inp.value = saved; inp.readOnly = true;
            }
        }

        function startTen() {
            const inp = document.getElementById('user-input');
            if(!inp.value.trim()) return alert("İsim yaz bro!");
            if(!localStorage.getItem('ten_user')) localStorage.setItem('ten_user', inp.value);
            activeUser = inp.value;
            document.getElementById('active-p').innerText = activeUser;
            changePage('ten-game');
            initTen();
        }

        function initTen() {
            num = 1; last = null;
            document.getElementById('cur-num').innerText = "1";
            const b = document.getElementById('board');
            b.innerHTML = '';
            for(let i=0; i<100; i++) {
                const c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => move(i, c);
                b.appendChild(c);
            }
            refreshTen();
        }

        function move(i, c) {
            const r = Math.floor(i/10), col = i%10;
            if(c.classList.contains('filled')) return;
            if(num === 1 || checkMove(r, col)) {
                c.innerText = num; c.classList.add('filled');
                last = {r, col}; num++;
                document.getElementById('cur-num').innerText = num;
                refreshTen();
            }
        }

        function checkMove(r, c) {
            if(!last) return true;
            const dr = Math.abs(r - last.r), dc = Math.abs(c - last.col);
            return (dr === 3 && dc === 0) || (dr === 0 && dc === 3) || (dr === 2 && dc === 2);
        }

        function refreshTen() {
            document.querySelectorAll('.cell').forEach((c, i) => {
                c.classList.remove('hint');
                if(!c.classList.contains('filled') && checkMove(Math.floor(i/10), i%10)) c.classList.add('hint');
            });
        }

        // --- MİRKO MANTIĞI ---
        function pick(e, id) {
            selectedW = e; csr.innerText = e; csr.style.display = "block";
            document.getElementById('main-body').classList.add('cursor-active');
            document.querySelectorAll('.w-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(id).classList.add('selected');
        }

        function hit(e) {
            if(!selectedW) return alert("Sopayı seç bro!");
            snd.currentTime = 0; snd.play().catch(() => {});
            darbe++; document.getElementById('mirko-stats').innerText = "HASAR: " + darbe;
            const img = document.getElementById('mirko-img');
            img.style.transform = "scale(0.9) rotate(8deg)";
            img.style.filter = "sepia(1) saturate(10) hue-rotate(-50deg)";
            setTimeout(() => { img.style.transform = "scale(1)"; img.style.filter = "none"; }, 100);
        }

        function exitMirko() {
            selectedW = ""; csr.style.display = "none";
            document.getElementById('main-body').classList.remove('cursor-active');
            changePage('lobby-page');
        }

        document.addEventListener('mousemove', (e) => {
            csr.style.left = e.clientX + 'px';
            csr.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
